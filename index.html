<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Portal · Guardian Angel</title>
  <meta name="description" content="Guardian Angel Acquisitions student portal: onboarding, messaging playbook, compliance and training for outreach associates.">
  <link rel="icon" href="assets/roofline-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:ital,wght@0,400..800;1,400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ga-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript><p style="padding:24px">The student portal needs JavaScript turned on.</p></noscript>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
